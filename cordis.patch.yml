# ============================================================================
# dsh-persona-memory —— DSH bundle patch（插件自带的挂载声明）
# ============================================================================
# 一个包装两个插件：
#   persona-distill  —— 人格蒸馏：原料天天攒，人格按周期定型
#   persona-journal  —— 日记：每天写她主观在意的那几件事
#
# 装上之后，profile 只要在 `dsh.profile.bundles` 里列出本包名即生效：
#
#   dsh plugin --profile desktop add dsh-persona-memory
#   （本地开发：dsh plugin --profile desktop add link:<插件目录>）
#
# 组成顺序：每个 bundle 的 patch 按 dsh.profile.bundles 顺序叠
#          → 再叠 profile 自己那一层的 cordis.patch.yml
# ============================================================================

- insert:
    - id: persona-distill
      name: dsh-persona-memory
      config:
        # 真正的用户配置在 <家>/persona-distill/config.json（设置页可改），这里只放默认值
        enabled: false
        runAt: '04:10'

    - id: persona-journal
      name: dsh-persona-memory/journal
      config:
        # 用户配置在 <家>/persona-journal/config.json（首次运行会自动写默认值）
        enabled: true
        runAt: '23:50'
        # 日记目录；留空 = <家>/persona/journal
        journalDir: ''
        # 日记目录不可写时退回这里；留空 = <家>/persona/journal
        fallbackJournalDir: ''
        # SnowLuma 日志目录（snowluma-YYYY-MM-DD.log 所在处）；留空 = 不写日记
        snowlumaLogDir: ''
        # 可选：读一份 bridge 的 config.json，只取 allow 白名单里的会话片段
        bridgeConfigPath: ''
        # headless 跑模型用的 DSH 可执行文件与 bin.js；留空则读环境变量 DSH_EXE / DSH_BIN
        dshExe: ''
        dshBin: ''
        # 素材渠道。留空 = 只读 snowlumaLogDir（兼容旧配置）。
        # 想做「不分渠道」就显式列出来：
        #
        # sources:
        #   - type: snowluma-log          # QQ 聊天
        #     dir: 'E:/SnowLuma/logs'
        #     bridgeConfigPath: 'E:/ai/qq-bridge/config.json'
        #     limit: 40
        #   - type: external              # B站手账等，复用 distill 的适配器
        #     adapter: bili-journal
        #     label: 'B站'
        #   - type: inbox                 # 干活时手写的手记
        #     dir: '<家>/work-inbox'
        #     label: '工作'
        #     markerOnly: true            # 只取 <!-- diary --> ... <!-- /diary --> 之间
        #     enabled: false              # 默认关，想开再打开
        sources: []
        maxSnippetsPerSource: 40
        # 每天最多写几行（1~10，默认 5）
        maxLines: 5

    - id: life-memory
      name: dsh-persona-memory/life-memory
      config:
        # 用户配置在 <家>/life-memory/config.json（首次运行写默认值）
        enabled: true
        # 线索库位置；留空 = <家>/life-memory/memory.db
        dbPath: ''
        # 一次 recall 最多取几条线索、拼多长
        limit: 5
        maxPromptChars: 1800
        autoForget: true
        # 超过这个 token 就开始遗忘
        forgetThresholdTokens: 20000
        # 单次最多切几轮（200 = 一次砍到位）
        forgetTurns: 200
        # 最近这么多轮永远保留
        keepCompletedTurns: 5
        # 哪些会话走激进策略（JSON，能被递归扫出 session-xxx id 即可）。
        # 留空 = 全部用上面的默认值；想区分就把会话 id 列进去：
        #   sessionsFile: 'E:/ai/qq-bridge/state/sessions.json'
        #   qqPolicy:
        #     aggressive: { forgetThresholdTokens: 20000, forgetTurns: 200, keepCompletedTurns: 5 }
        #     gentle:     { forgetThresholdTokens: 60000, forgetTurns: 10, keepCompletedTurns: 20 }
        sessionsFile: ''
