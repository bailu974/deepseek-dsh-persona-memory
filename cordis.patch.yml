# ============================================================================
# dsh-persona-memory —— DSH bundle patch（插件自带的挂载声明）
# ============================================================================
# 一个包装两个插件：
#   persona-distill  —— 人格蒸馏：原料天天攒，人格按周期定型
#   persona-journal  —— 日记：每天写她主观在意的那几件事
#
# 装上之后，profile 只要在 `dsh.profile.bundles` 里列出本包名即生效：
#
#   dsh plugin --profile desktop add dsh-persona-memory
#   （本地开发：dsh plugin --profile desktop add link:<插件目录>）
#
# 组成顺序：每个 bundle 的 patch 按 dsh.profile.bundles 顺序叠
#          → 再叠 profile 自己那一层的 cordis.patch.yml
# ============================================================================

- insert:
    - id: persona-distill
      name: dsh-persona-memory
      config:
        # 真正的用户配置在 <家>/persona-distill/config.json（设置页可改），这里只放默认值
        enabled: false
        runAt: '04:10'

    - id: persona-journal
      name: dsh-persona-memory/journal
      config:
        # 用户配置在 <家>/persona-journal/config.json（首次运行会自动写默认值）
        enabled: true
        runAt: '23:50'
        # 日记目录；留空 = <家>/persona/journal
        journalDir: ''
        # 日记目录不可写时退回这里；留空 = <家>/persona/journal
        fallbackJournalDir: ''
        # SnowLuma 日志目录（snowluma-YYYY-MM-DD.log 所在处）；留空 = 不写日记
        snowlumaLogDir: ''
        # 可选：读一份 bridge 的 config.json，只取 allow 白名单里的会话片段
        bridgeConfigPath: ''
        # headless 跑模型用的 DSH 可执行文件与 bin.js；留空则读环境变量 DSH_EXE / DSH_BIN
        dshExe: ''
        dshBin: ''
